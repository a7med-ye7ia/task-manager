services:
  postgres:
    image: postgres:16-alpine
    container_name: taskmanagesys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-taskmanagesys}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-taskmanagesys}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: taskmanagesys-mailpit
    restart: unless-stopped
    ports:
      - "${SPRING_MAIL_PORT:-1025}:1025" # SMTP
      - "8025:8025"                      # Web UI
    environment:
      MP_MAX_MESSAGES: 5000

volumes:
  postgres_data:
