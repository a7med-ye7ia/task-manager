context:
  initializer:
    classes: com.taskmanagesys.TestDatabaseInitializer

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_TEST_NAME:taskmanagesys_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""

app:
  cookie:
    secure: false
  jobs:
    enabled: false
  email:
    sender:
      enabled: false
  mail:
    enabled: false
    from: no-reply@localhost
    from-name: Task Management System
  base-url: http://localhost:5173
  upload-dir: ./target/test-uploads
  jwt-secret: supersecretjwtkeythatisatleast256bitslongfortaskmanagementsystem2026
  timezone: Africa/Cairo
  seed-manager:
    first-name: System
    last-name: Manager
    email: manager@gmail.com
    password: Manager123!
    phone: "+201000000000"
