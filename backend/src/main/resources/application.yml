server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: taskmanagesys-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskmanagesys}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:10000}
          timeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:10000}
          writetimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:10000}

app:
  cookie:
    secure: ${COOKIE_SECURE:true}
  archive:
    cron: ${ARCHIVE_CRON:0 0 2 * * *}
    zone: ${ARCHIVE_ZONE:Africa/Cairo}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  upload-dir: ${UPLOAD_DIR:./uploads}
  jwt-secret: ${JWT_SECRET:supersecretjwtkeythatisatleast256bitslongfortaskmanagementsystem2026}
  file-view-secret: ${FILE_VIEW_SECRET}
  timezone: Africa/Cairo
  time:
    shift-hours: ${SHIFT_HOURS:8}
    overtime-max-hours: ${OVERTIME_MAX_HOURS:2}
    pause-timeout-hours: ${PAUSE_TIMEOUT_HOURS:12}
    idle-minutes: ${IDLE_MINUTES:15}
    shift-alert-grace-minutes: ${SHIFT_ALERT_GRACE_MINUTES:5}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:${MAIL_USERNAME:no-reply@localhost}}}
    from-name: Task Manager
    reply-to: ${MAIL_REPLY_TO:}
  seed-manager:
    first-name: ${SEED_MANAGER_FIRST_NAME:System}
    last-name: ${SEED_MANAGER_LAST_NAME:Manager}
    email: ${SEED_MANAGER_EMAIL:manager@gmail.com}
    password: ${SEED_MANAGER_PASSWORD:Manager123!}
    phone: ${SEED_MANAGER_PHONE:+201000000000}
